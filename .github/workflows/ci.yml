name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check service worker and options script
        run: |
          node --check background.js
          node --check options.js

      - name: Run unit tests
        run: npm test

      - name: Validate manifest
        run: node scripts/validate-manifest.mjs

      - name: Assemble extension bundle
        run: |
          mkdir -p dist/ext
          cp manifest.json background.js options.html options.js dist/ext/

      - name: Lint extension (Chrome and Edge relevant errors only)
        run: node scripts/check-lint.mjs dist/ext
