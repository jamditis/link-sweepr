<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkSweepr</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129529;</text></svg>" />
    <style>
      :root {
        --bg: #12151c;
        --panel: #1b1f29;
        --ink: #e7e9ee;
        --muted: #9aa3b2;
        --accent: #2f6bf5;
        --accent-2: #4fc3f5;
        --line: #2a3040;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 300px;
        padding: 16px;
        background: radial-gradient(600px 300px at 15% -20%, #1d2430 0%, var(--bg) 60%);
        color: var(--ink);
        font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      header img { width: 28px; height: 28px; border-radius: 7px; }
      header h1 {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 14px;
        letter-spacing: 0.02em;
        margin: 0;
      }
      .count { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
      .count b { color: var(--ink); font-weight: 600; }
      .swept { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
      .swept b { color: var(--ink); font-weight: 600; }
      .site {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .site .host {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 13px;
        word-break: break-all;
        margin: 0 0 10px;
      }
      .site .host.muted { color: var(--muted); }
      button {
        width: 100%;
        background: var(--accent);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { filter: brightness(1.08); }
      button:disabled { background: var(--line); color: var(--muted); cursor: default; }
      .foot { display: flex; justify-content: space-between; align-items: center; min-height: 18px; }
      button.manage {
        width: auto;
        background: none;
        border: none;
        padding: 0;
        color: var(--accent-2);
        font-weight: 400;
        font-size: 13px;
        cursor: pointer;
      }
      button.manage:hover { text-decoration: underline; filter: none; }
      #status { color: var(--accent-2); font-size: 12px; }
      .privacy {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
        margin: 14px 0 0;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" />
      <h1>LinkSweepr</h1>
    </header>
    <p class="count"><b id="count">0</b> <span id="count-label">domains filtered</span></p>
    <p class="swept"><b id="swept">0</b> <span id="swept-label">entries removed this session</span></p>
    <div class="site">
      <p class="host muted" id="host">Checking this tab&hellip;</p>
      <button id="block" disabled>Block this site</button>
    </div>
    <div class="foot">
      <button class="manage" id="manage" type="button">Manage all domains &rarr;</button>
      <span id="status"></span>
    </div>
    <p class="privacy">
      Everything stays on this device. The domain list never leaves your browser,
      and nothing is sent anywhere.
    </p>
    <script src="domain.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
